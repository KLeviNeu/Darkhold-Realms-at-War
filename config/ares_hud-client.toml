	[properties.Global_Offsets]
		defaultOffHandOffsets = "0,0,0,0"
		separateOffHandOffsets = "-2,-3,0,0"
		selectedItemNameOffsets = "2,0,0,0"

	[properties.Global_Buff_Settings]
		#Scale factor for buff icons.
		#Range: 0.1 ~ 5.0
		buffFrameScaleFactor = 0.5
		#Vertical offset of buff bar from the bottom center HUD.
		#Range: -100 ~ 100
		buffBarVerticalOffset = 2
		#Horizontal gap between buff icons.
		#Range: 0 ~ 50
		buffIconHorizontalGap = 2
		#Vertical gap between rows of buff icons.
		#Range: 0 ~ 50
		buffRowVerticalGap = 2

	[properties.Global_Toggles]
		#Allow Ares HUD to override Mana Unification/Iron's Spells/Covenant of the Seven Mana/LP bars.
		#Set to false if you want to use the original mod's UI.
		overrideSpellBars = true
		#Select whether Spice of Life: Valheim Reforged renders its native food HUD or Ares HUD renders the food slots.
		#Allowed Values: NATIVE, ARES
		valheimFoodHudMode = "NATIVE"
		#Replace the food/hunger bar with the mana bar.
		#Functions similarly to the TcrCore/DuelCraft integration. Suitable for magic-heavy modpacks.
		replaceFoodWithMana = false
		#Always Display mana for Mana Unification
		focusDisplayManaMu = true
		#Always Display mana for Iron's Spells
		focusDisplayManaIss = false
		#Always Display Food In Status Valuebar, if turned off, it depend on wether the bar is on
		focusDisplayStatusValueBarFood = true
		#Always Display Mana In Status Valuebar, if turned off, it depend on wether the bar is on
		focusDisplayStatusValueBarMana = true
		#Always Display Armor In Status Valuebar, if turned off, it depend on wether the bar is on
		focusDisplayStatusValueBarArmor = true
		#Automatically snap the XP/Ascension orb to the center of the gap between left and right status bars.
		#When disabled, a scale-aware proximity check is used instead.
		snapXpToCenterHud = true

